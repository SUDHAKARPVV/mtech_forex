   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="353.16" y="27.057169" transform="rotate(-0 353.16 27.057169)">Layer 3.1.8 — Regime-aware probabilistic output heads</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="353.16" y="38.426334" transform="rotate(-0 353.16 38.426334)">Two specialised decoders are blended continuously by volatility, and each emits a mean and a variance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="93.69" y="132.621282" transform="rotate(-0 93.69 132.621282)">Context vector</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="93.69" y="142.969873" transform="rotate(-0 93.69 142.969873)">(B, 352)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="93.69" y="222.382465" transform="rotate(-0 93.69 222.382465)">Regime context</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="93.69" y="232.786665" transform="rotate(-0 93.69 232.786665)">(B, 2) vol, ATR</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="86.561423" transform="rotate(-0 256.2912 86.561423)">Stable-regime head</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="96.791803" transform="rotate(-0 256.2912 96.791803)">MLP → μ, log σ²</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="170.334742" transform="rotate(-0 256.2912 170.334742)">High-volatility head</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="180.617083" transform="rotate(-0 256.2912 180.617083)">MLP → μ, log σ²</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="254.263944" transform="rotate(-0 256.2912 254.263944)">Soft regime gate</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="256.2912" y="264.442363" transform="rotate(-0 256.2912 264.442363)">g = σ(W · regime) ∈ [0,1]</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="425.8116" y="132.517704" transform="rotate(-0 425.8116 132.517704)">Continuous blend</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="425.8116" y="142.696123" transform="rotate(-0 425.8116 142.696123)">(1−g)·stable + g·high-vol</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="602.2512" y="88.712802" transform="rotate(-0 602.2512 88.712802)">Mean μ</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="602.2512" y="98.787643" transform="rotate(-0 602.2512 98.787643)">(B, k) log-return</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="602.2512" y="176.530106" transform="rotate(-0 602.2512 176.530106)">Band σ</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="602.2512" y="186.604603" transform="rotate(-0 602.2512 186.604603)">exp(½ log σ²) · (B, k)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="353.16" y="311.065965" transform="rotate(-0 353.16 311.065965)">L_NLL  =  ½ Σₕ [ exp(−log σ²ₕ) · (yₕ − μₕ)²  +  log σ²ₕ ]</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(84.633125 362.64622)">The Gaussian negative log-likelihood is what makes the model probabilistic rather than a point predictor: over-confidence is punished</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(88.87 374.64622)">by the squared-error term and under-confidence by the log-variance term, so σ must widen when the model is genuinely uncertain.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(177.134375 386.64622)">This σ is the quantity later re-calibrated by adaptive conformal inference in Section 5.4.</text>
   </g>
