   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="358.74" y="26.225569" transform="rotate(-0 358.74 26.225569)">Section 4.1 — Chronological splitting and walk-forward evaluation</text>
   </g>
   <g id="text_3">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="358.74" y="36.330702" transform="rotate(-0 358.74 36.330702)">The split is made in time order and never shuffled; every fitted quantity looks only backwards</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="137.2698" y="171.770555" transform="rotate(-0 137.2698 171.770555)">Normalisation statistics</text>
   </g>
