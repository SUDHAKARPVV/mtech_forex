    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="274.19463" y="83.474243" transform="rotate(-0 274.19463 83.474243)">TRAIN  ·  70%</text>
   </g>
