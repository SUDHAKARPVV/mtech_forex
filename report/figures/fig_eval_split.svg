   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="337.6476" y="171.822516" transform="rotate(-0 337.6476 171.822516)">Early stopping</text>
   </g>
