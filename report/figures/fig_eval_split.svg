   <g id="text_20">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(83.93875 349.18678)">No shuffling at any point: a random split would let the model interpolate between neighbouring hourly bars and is invalid for time series.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(54.846875 361.18678)">Each baseline block is predicted by a model fitted only on data preceding it, so the classical comparators face exactly the same information constraint.</text>
   </g>
