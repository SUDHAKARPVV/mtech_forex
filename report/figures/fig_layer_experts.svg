   </g>
   <g id="text_24">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(119.160625 348.7987)">Because both stages are convex combinations, the worst case is deferral to the strongest single expert — the fusion</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(92.805 360.7987)">cannot make the model worse than its best component. A deep-supervision term keeps the deep branch independently accurate.</text>
   </g>
