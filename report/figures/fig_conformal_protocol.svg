   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="358.74" y="27.057169" transform="rotate(-0 358.74 27.057169)">Section 4.6 — Interval calibration: split conformal and the adaptive extension</text>
   </g>
   <g id="text_4">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="358.74" y="38.426334" transform="rotate(-0 358.74 38.426334)">Split conformal assumes exchangeability; ACI drops that assumption and controls coverage online</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="116.1774" y="124.40661" transform="rotate(-0 116.1774 124.40661)">Calibration split</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="116.1774" y="134.87243" transform="rotate(-0 116.1774 134.87243)">3,102 held-out origins</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="288.432" y="124.40661" transform="rotate(-0 288.432 124.40661)">Normalised residuals</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="288.432" y="134.786883" transform="rotate(-0 288.432 134.786883)">|y − μ| / σ</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="460.6866" y="124.630571" transform="rotate(-0 460.6866 124.630571)">Quantile q̂(1−α)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="460.6866" y="134.87243" transform="rotate(-0 460.6866 134.87243)">one number per horizon</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="618.8796" y="129.412681" transform="rotate(-0 618.8796 129.412681)">μ ± q̂·σ</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="137.2698" y="246.204811" transform="rotate(-0 137.2698 246.204811)">Working level αₜ</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="137.2698" y="257.325858" transform="rotate(-0 137.2698 257.325858)">starts at the nominal α</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="337.6476" y="246.204811" transform="rotate(-0 337.6476 246.204811)">Interval at αₜ</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="337.6476" y="256.76467" transform="rotate(-0 337.6476 256.76467)">μ ± q̂(1−αₜ)·σ</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="538.0254" y="246.204811" transform="rotate(-0 538.0254 246.204811)">Observe outcome</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="538.0254" y="257.325858" transform="rotate(-0 538.0254 257.325858)">errₜ = 1 if outside</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="337.6476" y="306.02805" transform="rotate(-0 337.6476 306.02805)">Update the level</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="337.6476" y="316.489878" transform="rotate(-0 337.6476 316.489878)">αₜ₊₁ = αₜ + γ(α − errₜ)</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="358.74" y="357.508816" transform="rotate(-0 358.74 357.508816)">a run of misses lowers αₜ, widening later intervals until empirical coverage recovers</text>
   </g>
   <g id="text_21">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(53.395625 385.810444)">The guarantee changes character: split conformal offers finite-sample coverage under exchangeability, ACI offers long-run average coverage without it.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(121.244375 397.810444)">The price is a wider and occasionally infinite interval — and that infinite fraction is itself a usable regime-stress signal.</text>
   </g>
   <g id="text_22">
    <g id="patch_20">
     <path d="M 30.709421 283.324513 
L 65.247859 283.324513 
L 65.247859 273.943967 
L 30.709421 273.943967 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #475569" x="47.97864" y="280.452873" transform="rotate(-0 47.97864 280.452873)">feedback</text>
   </g>
   <g id="text_23">
    <text style="font-style: italic; font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b45309" x="358.74" y="169.692013" transform="rotate(-0 358.74 169.692013)">valid only while test residuals are exchangeable with calibration residuals — which a volatility regime shift breaks</text>
   </g>
  </g>
 </g>
