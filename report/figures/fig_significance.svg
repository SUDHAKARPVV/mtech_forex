   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="369.9" y="26.641369" transform="rotate(-0 369.9 26.641369)">Section 4.4 — Three significance tests, and why two of them can disagree</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="369.9" y="37.378518" transform="rotate(-0 369.9 37.378518)">The tests are not interchangeable: they resample different objects and score different losses</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="55.993414" transform="rotate(-0 369.9 55.993414)">Frozen seed-9 forecasts</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="64.758571" transform="rotate(-0 369.9 64.758571)">never re-tuned after scoring</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="145.026" y="134.58161" transform="rotate(-0 145.026 134.58161)">Block bootstrap</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="145.026" y="145.550174" transform="rotate(-0 145.026 145.550174)">2,000 resamples · block length 50</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="134.58161" transform="rotate(-0 369.9 134.58161)">Diebold–Mariano</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="145.550174" transform="rotate(-0 369.9 145.550174)">Newey–West HAC · lag 10</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="594.774" y="134.373766" transform="rotate(-0 594.774 134.373766)">Hansen Model Confidence Set</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="594.774" y="146.257362" transform="rotate(-0 594.774 146.257362)">90% level</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="145.026" y="196.75168" transform="rotate(-0 145.026 196.75168)">scores the RANK metrics</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="145.026" y="205.22579" transform="rotate(-0 145.026 205.22579)">Spearman · large-move accuracy</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="196.751368" transform="rotate(-0 369.9 196.751368)">scores SQUARED ERROR</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="205.932978" transform="rotate(-0 369.9 205.932978)">loss differential</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="594.774" y="196.751368" transform="rotate(-0 594.774 196.751368)">scores SQUARED ERROR</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="594.774" y="205.932978" transform="rotate(-0 594.774 205.932978)">elimination on loss</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(91.42875 252.292605)">Does the model ORDER</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(101.359078 262.134848)">move sizes better?</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(336.370969 252.292605)">Does it reduce</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(321.466828 262.134848)">mean squared error?</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(549.018641 252.292605)">Is it distinguishable</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(535.641109 262.134848)">from the best forecaster?</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="369.9" y="375.876988" transform="rotate(-0 369.9 375.876988)">All three tests are run on the same frozen forecast arrays, and each result is reproduction-guarded against the committed point estimate before it is reported.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="369.9" y="298.352922" transform="rotate(-0 369.9 298.352922)">Why they diverge on silver and euro</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(49.439375 320.069544)">Squared error is dominated by a handful of extreme moves and is sensitive to the SCALE of the forecast; rank metrics are unit-free and depend only on ORDER.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(53.840625 329.671731)">A model can order future magnitude substantially better without reducing squared error — so the bootstrap can be significant while DM and the MCS are not.</text>
   </g>
  </g>
 </g>
