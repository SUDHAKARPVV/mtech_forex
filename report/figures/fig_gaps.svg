   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="375.48" y="26.918569" transform="rotate(-0 375.48 26.918569)">Section 2 — Four gaps in the reviewed literature, and the component that closes each</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="375.48" y="38.077062" transform="rotate(-0 375.48 38.077062)">The architecture and the evaluation protocol are both answers to specific weaknesses in prior work</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="653.89968" y="103.903744" transform="rotate(-0 653.89968 103.903744)">§ 3.1</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="653.89968" y="172.787944" transform="rotate(-0 653.89968 172.787944)">§ 3.1.8</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="653.89968" y="241.672144" transform="rotate(-0 653.89968 241.672144)">§ 4.2, 4.4</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="653.89968" y="310.556344" transform="rotate(-0 653.89968 310.556344)">§ 4.6, 5.4</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(72.205625 367.5097)">Each gap was identified during the literature review and each is answered by a specific, named component rather than by the architecture as a whole.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(89.5525 379.5097)">Gaps three and four are methodological rather than architectural, and it is those two that produced the negative results reported in Section 5.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="147.1464" y="61.392352" transform="rotate(-0 147.1464 61.392352)">GAP IN THE LITERATURE</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="419.6736" y="61.392352" transform="rotate(-0 419.6736 61.392352)">COMPONENT THAT CLOSES IT</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="653.89968" y="61.392352" transform="rotate(-0 653.89968 61.392352)">WHERE</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(92.6589 94.14601)">Single-purpose pipelines —</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(84.7014 103.748197)">CNN, recurrence, attention and</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(88.6389 113.350385)">sentiment treated separately</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(337.14235 94.14601)">One unified dual-tower architecture:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(331.045475 103.748197)">CNN → cross-attention → Transformer →</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(345.79485 113.350385)">gated recurrence → expert blend</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(95.849525 163.03021)">Single-step forecasting —</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(94.773275 172.632397)">error compounding across</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(96.398275 182.234585)">horizons left unexamined</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(336.1636 163.03021)">Ten-step direct multi-horizon output,</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(338.3211 172.632397)">with a mean and a variance emitted</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(393.869225 182.234585)">per horizon</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(94.08765 231.91441)">Accuracy reported without</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(98.4639 241.516597)">the base rate of the test</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(92.92015 251.118785)">window, and without a test</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(331.0736 231.91441)">Base-rate control on every claim, three</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(327.72485 241.516597)">seeds, block bootstrap, Diebold–Mariano</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(352.03485 251.118785)">and the Model Confidence Set</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(97.617025 300.79861)">Uncertainty bands never</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(103.974525 310.400797)">checked against their</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(111.215775 320.002985)">nominal coverage</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(341.589225 300.79861)">Adaptive conformal inference with</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(329.28735 310.400797)">measured empirical coverage, deployed</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(352.285475 320.002985)">live rather than only reported</text>
   </g>
  </g>
 </g>
