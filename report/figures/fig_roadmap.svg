   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="369.9" y="26.918569" transform="rotate(-0 369.9 26.918569)">Section 6 — Forward programme, ordered by the strength of the evidence behind it</text>
   </g>
   <g id="text_5">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="369.9" y="38.077062" transform="rotate(-0 369.9 38.077062)">The measured results decide the priority: work on the axis that was shown to carry signal, not the one that was hoped to</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="141.399" y="100.273287" transform="rotate(-0 141.399 100.273287)">Extend ACI to silver and euro</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(84.801187 109.885425)">the layer is fitted for gold only;</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(78.684016 120.470425)">coverage is the most robust result</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="141.399" y="151.496368" transform="rotate(-0 141.399 151.496368)">Volatility-targeted sizing</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(79.071258 161.056545)">magnitude is the predictable axis,</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(75.558703 171.641545)">so size positions from interval width</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="141.399" y="202.563566" transform="rotate(-0 141.399 202.563566)">Attention and trust-gate readout</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(76.140992 212.227665)">the gates are already interpretable;</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(72.775578 222.812665)">this is instrumentation, not modelling</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="141.399" y="253.734686" transform="rotate(-0 141.399 253.734686)">Per-instrument conformal study</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="141.399" y="268.691285" transform="rotate(-0 141.399 268.691285)">compare width and stress across pairs</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="100.221326" transform="rotate(-0 369.9 100.221326)">Long-context statement encoding</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(298.734125 110.592612)">tests whether the null sentiment result</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(303.931953 121.177612)">is about markets or about headlines</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="151.444407" transform="rotate(-0 369.9 151.444407)">Lower-frequency macro study</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(306.613563 161.391318)">the ablation is an H1 result; macro</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(302.773648 171.641545)">may act over days rather than hours</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="202.667488" transform="rotate(-0 369.9 202.667488)">Cross-instrument transfer</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(312.709633 212.227665)">does silver's volatility structure</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(325.416195 222.812665)">transfer to gold or euro?</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="369.9" y="253.838608" transform="rotate(-0 369.9 253.838608)">RL execution layer</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(316.221047 263.398785)">beyond the supervised scope</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(335.862609 274.690972)">of this dissertation</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="598.401" y="100.273287" transform="rotate(-0 598.401 100.273287)">Order-flow / depth of market</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(532.401016 109.885425)">no consolidated book exists for spot</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(529.57968 120.470425)">metals and FX; MT5 depth is live-only</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="598.401" y="151.496368" transform="rotate(-0 598.401 151.496368)">Consolidated tape</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="598.401" y="166.349045" transform="rotate(-0 598.401 166.349045)">would require a commercial licence</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="598.401" y="202.615527" transform="rotate(-0 598.401 202.615527)">Tick-level microstructure</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(535.728219 212.227665)">storage and licensing cost beyond</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(549.771594 222.812665)">the scope of a dissertation</text>
   </g>
   <g id="text_28">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(99.336875 345.86038)">Lane 1 items follow directly from measured results: magnitude and interval calibration are where this system was shown to add value.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(111.63 357.86038)">Lane 2 items would each test a specific alternative explanation for a null result rather than simply adding capacity to the model.</text>
   </g>
   <g id="text_29">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(534.31225 250.808362)">These stay closed until the data</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(518.47475 260.410549)">becomes available — they are recorded</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(526.771 270.012737)">so the gap is explicit, not forgotten.</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f766e" x="141.399" y="308.796037" transform="rotate(-0 141.399 308.796037)">Do next</text>
   </g>
   <g id="text_31">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6d48c7" x="369.9" y="308.796404" transform="rotate(-0 369.9 308.796404)">Worth testing</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="598.401" y="308.796037" transform="rotate(-0 598.401 308.796037)">Cannot start</text>
   </g>
  </g>
 </g>
