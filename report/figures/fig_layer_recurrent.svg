   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="353.16" y="26.225569" transform="rotate(-0 353.16 26.225569)">Layer 3.1.6 — Parallel gated recurrent stage and attention pooling</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="353.16" y="36.330702" transform="rotate(-0 353.16 36.330702)">Two recurrent inductive biases are run in parallel and mixed by a learned scalar, rather than choosing one in advance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="83.3112" y="112.259194" transform="rotate(-0 83.3112 112.259194)">Transformer output</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="83.3112" y="121.63767" transform="rotate(-0 83.3112 121.63767)">(B, T, 256)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="225.1548" y="78.568956" transform="rotate(-0 225.1548 78.568956)">Bi-LSTM</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="225.1548" y="87.852573" transform="rotate(-0 225.1548 87.852573)">forward + backward, H = 128</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="225.1548" y="146.261196" transform="rotate(-0 225.1548 146.261196)">Bi-GRU</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="225.1548" y="155.544813" transform="rotate(-0 225.1548 155.544813)">forward + backward, H = 128</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="366.9984" y="78.51666" transform="rotate(-0 366.9984 78.51666)">Concatenate</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="366.9984" y="87.79155" transform="rotate(-0 366.9984 87.79155)">(B, T, 256)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="366.9984" y="146.2089" transform="rotate(-0 366.9984 146.2089)">Concatenate</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="366.9984" y="155.48379" transform="rotate(-0 366.9984 155.48379)">(B, T, 256)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.842" y="112.363116" transform="rotate(-0 508.842 112.363116)">Learned gate</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.842" y="121.641662" transform="rotate(-0 508.842 121.641662)">λ = σ(W·[meanL, meanG])</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="638.23104" y="112.259194" transform="rotate(-0 638.23104 112.259194)">Convex mixture</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="638.23104" y="121.641662" transform="rotate(-0 638.23104 121.641662)">λ·LSTM + (1−λ)·GRU</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.842" y="213.849515" transform="rotate(-0 508.842 213.849515)">Attention pooling</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.842" y="222.90228" transform="rotate(-0 508.842 222.90228)">learned query over T</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="638.23104" y="213.953093" transform="rotate(-0 638.23104 213.953093)">Deep context</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="638.23104" y="223.17603" transform="rotate(-0 638.23104 223.17603)">(B, 256)</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="353.16" y="289.402841" transform="rotate(-0 353.16 289.402841)">temporal = λ · BiLSTM(x) + (1 − λ) · BiGRU(x)      context = Σₜ αₜ · temporalₜ ,   α = softmax(w·temporal)</text>
   </g>
   <g id="text_22">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(104.484375 338.20966)">The gate is computed from the mean-pooled state of each branch, so the mixture adapts to the instrument and the regime.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(144.079375 350.20966)">Attention pooling then decides which of the 60 bars matter, rather than privileging the most recent one.</text>
   </g>
  </g>
