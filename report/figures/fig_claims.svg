   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="375.48" y="27.057169" transform="rotate(-0 375.48 27.057169)">Section 7 — The three claims, the evidence behind each, and how strongly each is held</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="375.48" y="38.426334" transform="rotate(-0 375.48 38.426334)">Every claim is stated with the scope that the evidence actually supports</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="677.4696" y="105.234304" transform="rotate(-0 677.4696 105.234304)">STRONG</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="677.4696" y="191.055424" transform="rotate(-0 677.4696 191.055424)">QUALIFIED</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="677.4696" y="276.876544" transform="rotate(-0 677.4696 276.876544)">STRONG</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="117.684" y="58.13248" transform="rotate(-0 117.684 58.13248)">CLAIM</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="312.8724" y="58.13248" transform="rotate(-0 312.8724 58.13248)">EVIDENCE</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="508.0608" y="58.13248" transform="rotate(-0 508.0608 58.13248)">WHAT WOULD OVERTURN IT</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="677.4696" y="58.13248" transform="rotate(-0 677.4696 58.13248)">STRENGTH</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74.002687 100.141531)">Hourly direction is</text>
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(78.746062 110.223828)">not forecastable</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(260.416181 95.664664)">3 instruments × 3 seeds ×</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(253.791666 105.026797)">~15 framings, every one at or</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(266.469103 114.388929)">below its own base rate</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(446.352362 95.852757)">A framing clearing the base rate</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(455.398737 104.974836)">on the same bars it selects,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(463.417925 114.096914)">replicated across seeds</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(61.111312 180.921502)">The hybrid orders move</text>
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(63.649031 191.003799)">magnitude better than</text>
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(71.154562 201.086096)">ATR% and GARCH-σ</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(269.986416 181.485784)">3/3 seeds on all pairs;</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(254.841619 190.847917)">bootstrap significant on silver</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(270.896212 200.210049)">and euro, not on gold</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(448.296894 181.673877)">A squared-error test separating</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(452.833737 190.795956)">the models the other way, or</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(445.91655 199.918034)">failure to replicate out of sample</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(71.291062 266.742622)">Adaptive conformal</text>
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74.135906 276.824919)">inference restores</text>
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(78.278156 286.907216)">honest coverage</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(259.919541 267.306904)">79.9 / 90.0 / 95.0% against</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(247.051369 276.669037)">nominal, from 63.3 / 72.9 / 79.0%</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(263.626369 286.031169)">under the Gaussian band</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(443.05705 267.494997)">Coverage failing on an instrument</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(446.409956 276.617076)">other than gold, where the layer</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(478.978925 285.739154)">is not yet fitted</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="375.48" y="330.469314" transform="rotate(-0 375.48 330.469314)">Why the negative result carries as much weight as the positive one</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(61.414234 352.483773)">The same architecture, features, test bars and protocol produced the negative directional result and the positive magnitude result. A broken pipeline, an</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(71.539953 362.326016)">inadequate model or a mis-built test set would have suppressed both. That the two disagree is what makes each of them credible on its own terms.</text>
   </g>
  </g>
 </g>
 <defs>
  <clipPath id="p1d60da2613">
   <rect x="7.2" y="7.2" width="736.56" height="399.168"/>
