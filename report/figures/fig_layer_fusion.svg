   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1e3a5f" x="353.16" y="27.334369" transform="rotate(-0 353.16 27.334369)">Layer 3.1.3 — Cross-attention fusion of the price and news towers</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #64748b" x="353.16" y="39.124878" transform="rotate(-0 353.16 39.124878)">The price stream asks the questions; the news stream supplies the answers — and a presence gate decides how much of the answer is used</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="100.6092" y="97.067732" transform="rotate(-0 100.6092 97.067732)">Quant local</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="100.6092" y="107.707372" transform="rotate(-0 100.6092 107.707372)">(B, T, 128) from the CNN</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="97.067732" transform="rotate(-0 266.67 97.067732)">Linear → Q</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="107.42963" transform="rotate(-0 266.67 107.42963)">queries</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="100.6092" y="168.862188" transform="rotate(-0 100.6092 168.862188)">Text sequence</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="100.6092" y="179.502172" transform="rotate(-0 100.6092 179.502172)">(B, T, 128) from the GRU</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="168.862532" transform="rotate(-0 266.67 168.862532)">Linear → K, V</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="179.22443" transform="rotate(-0 266.67 179.22443)">keys and values</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="432.7308" y="132.656082" transform="rotate(-0 432.7308 132.656082)">Multi-head attention</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="432.7308" y="143.586707" transform="rotate(-0 432.7308 143.586707)">softmax(QKᵀ/√d)·V</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="100.6092" y="240.605371" transform="rotate(-0 100.6092 240.605371)">Raw text features</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="100.6092" y="251.29298" transform="rotate(-0 100.6092 251.29298)">(B, T, 13)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="240.656988" transform="rotate(-0 266.67 240.656988)">Presence gate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="266.67" y="251.296972" transform="rotate(-0 266.67 251.296972)">σ(W · text) ∈ [0, 1]</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="432.7308" y="240.605371" transform="rotate(-0 432.7308 240.605371)">Scale attention</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="432.7308" y="251.01923" transform="rotate(-0 432.7308 251.01923)">gate ⊙ attention output</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="605.7108" y="185.064928" transform="rotate(-0 605.7108 185.064928)">Residual + LayerNorm</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="605.7108" y="195.912412" transform="rotate(-0 605.7108 195.912412)">(B, T, 128) fused</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="353.16" y="302.975204" transform="rotate(-0 353.16 302.975204)">fused  =  LayerNorm( local  +  σ(W·text) ⊙ CrossAttention(local, text, text) )</text>
   </g>
   <g id="text_22">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(116.781875 366.48406)">When a bar carries no headlines the gate closes and the fusion degrades gracefully to the price representation alone.</text>
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; fill: #64748b" transform="translate(54.70625 378.48406)">During training the entire text stream is zeroed for a random 40% of samples (modality masking), so the model never becomes dependent on news.</text>
   </g>
